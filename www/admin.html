<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Table Assignment</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="admin-body">
    <div class="admin-container">
        <header class="admin-header">
            <h1>Organizer Dashboard</h1>
            <div class="admin-actions">
                <button id="show-qr-btn" class="secondary-btn">Show QR Code</button>
                <button id="reset-btn" class="danger-btn">Reset All Tables</button>
            </div>
        </header>

        <div id="stats-panel" class="stats-panel">
            <div class="stat-card">
                <h3>Total Guests</h3>
                <p id="total-guests-count">0 / 40</p>
            </div>
            <div class="stat-card">
                <h3>Tables Filled</h3>
                <p id="tables-filled-count">0 / 10</p>
            </div>
        </div>

        <div id="tables-grid" class="tables-grid">
            <!-- Tables will be rendered here dynamically -->
        </div>
    </div>

    <!-- QR Code Modal -->
    <div id="qr-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Scan to get your table!</h2>
            <div id="qrcode"></div>
            <p id="qr-url-display"></p>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
