<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check-in</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Admin App Redirect -->
    <script>
        // The APK runs on 'localhost' (Capacitor). The guest portal runs on 'jeferbayona.github.io'.
        // If we are running on localhost, redirect to the Admin Dashboard.
        if (window.location.hostname === 'localhost' || window.location.protocol === 'file:') {
            window.location.replace('admin.html');
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Error State if No Event ID -->
        <div id="no-event-state" class="card hidden">
            <h2 style="color: var(--danger); margin-bottom: 10px;">Invalid QR Code</h2>
            <p>No event was specified in this link.</p>
            <p style="margin-top: 15px; font-size: 14px; color: var(--text-muted);">Please scan the official QR code provided at the venue.</p>
        </div>

        <div id="app-content" class="hidden">
            <header>
                <h1 id="event-title-display">Welcome to the Event</h1>
                <p>Please enter your name to check in.</p>
            </header>

            <main id="main-content">
                <div class="card" id="registration-card">
                    <form id="assignment-form">
                        <div class="form-group">
                            <label for="guest-name">Full Name</label>
                            <input type="text" id="guest-name" name="guest-name" placeholder="e.g. John Doe" required autocomplete="off">
                        </div>
                        <button type="submit" id="submit-btn" class="primary-btn">Check In</button>
                        <p id="error-message" class="error hidden"></p>
                    </form>
                </div>

                <div class="card hidden" id="result-card">
                    <div class="success-icon">✓</div>
                    <h2>You're all set!</h2>
                    <p id="proceed-text">Checked in successfully.</p>
                    <div id="table-number-container" class="table-number-display hidden">
                        <span id="assigned-table-number">-</span>
                    </div>
                    <p class="guest-welcome">Have a great time, <span id="display-name"></span>!</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
